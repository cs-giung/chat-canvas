name: Bug report
description: Report a reproducible problem with Chat Canvas
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: site
    attributes:
      label: Affected site
      options:
        - ChatGPT
        - Gemini
        - Extension popup
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Extension and browser versions
      placeholder: "Chat Canvas 1.0.0, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Enable ...
        3. Observe ...
    validations:
      required: true
  - type: checkboxes
    id: visibility
    attributes:
      label: Visible extension UI
      options:
        - label: Collapse bars are visible beside messages
        - label: The conversation outline is visible
        - label: Changing content width resizes the composer
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or relevant DOM details. Remove private conversation content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed conversation content, cookies, tokens, and other private data.
          required: true
